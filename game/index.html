<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solano Vice — an original 2D top-down open-world crime game set in the coastal city of Port Solano. Steal cars, outrun the law, work six story jobs.">
<title>Solano Vice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solano Vice: explore Port Solano on foot and by car, complete missions and evade the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
